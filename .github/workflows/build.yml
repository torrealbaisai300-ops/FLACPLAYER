name: Build FLAC Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip and find project root
        run: |
          if [ ! -f FlacPlayer.zip ]; then
            echo "No se encontró FlacPlayer.zip" >&2
            exit 1
          fi
          
          mkdir temp_extract
          unzip -q FlacPlayer.zip -d temp_extract
          
          # Buscar dónde está settings.gradle.kts
          ROOT_DIR=$(find temp_extract -maxdepth 2 -type f -name "settings.gradle.kts" -exec dirname {} \;)
          
          if [ -z "$ROOT_DIR" ]; then
             ROOT_DIR=$(find temp_extract -maxdepth 2 -type f -name "build.gradle.kts" -exec dirname {} \;)
          fi
          
          if [ -z "$ROOT_DIR" ]; then
            echo "Error crítico: No se encontraron archivos Gradle dentro del ZIP." >&2
            ls -R temp_extract
            exit 1
          fi
          
          echo "Proyecto encontrado en: $ROOT_DIR"
          mv "$ROOT_DIR"/* . 
          rm -rf temp_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK Command Line Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Descargar herramientas CLI específicas
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          
          # Crear estructura de carpetas obligatoria
          mkdir -p $HOME/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/cmdline-tools
          mv $HOME/cmdline-tools/cmdline-tools $HOME/cmdline-tools/latest
          
          # Definir variables de entorno PARA ESTE STEP Y SIGUIENTES
          export ANDROID_HOME=$HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Aceptar licencias silenciosamente
          yes | sdkmanager --licenses || true
          
          # Instalar plataforma y build-tools necesarios
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate Gradle Wrapper (if missing)
        run: |
          # Si no existe gradlew, lo creamos con docker o instalando gradle globalmente temporalmente
          # Pero como usamos ubuntu-latest, podemos instalar gradle rápido si hace falta
          # MEJOR OPCIÓN: Forzar la creación vía comando si no hay wrapper
          if [ ! -f ./gradlew ]; then
             echo "Generando Gradle Wrapper..."
             # Instalamos un gradle temporal solo para generar el wrapper
             sudo apt-get install -y gradle
             gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        env:
          ANDROID_HOME: $HOME
          PATH: ${{ env.PATH }}:${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin:${{ env.ANDROID_HOME }}/platform-tools
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlacPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
