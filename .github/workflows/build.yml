name: Build FLAC Player APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip and find project root
        run: |
          if [ ! -f FlacPlayer.zip ]; then
            echo "No se encontró FlacPlayer.zip" >&2
            exit 1
          fi
          
          # Descomprimir en una carpeta temporal
          mkdir temp_extract
          unzip -q FlacPlayer.zip -d temp_extract
          
          # Buscar dónde está el archivo 'settings.gradle.kts' o 'build.gradle.kts'
          # Eso nos indica cuál es la raíz real del proyecto Android
          ROOT_DIR=$(find temp_extract -maxdepth 2 -type f -name "settings.gradle.kts" -exec dirname {} \;)
          
          if [ -z "$ROOT_DIR" ]; then
             # Si no encuentra settings, prueba con build.gradle.kts
             ROOT_DIR=$(find temp_extract -maxdepth 2 -type f -name "build.gradle.kts" -exec dirname {} \;)
          fi
          
          if [ -z "$ROOT_DIR" ]; then
            echo "Error crítico: No se encontraron archivos Gradle dentro del ZIP." >&2
            ls -R temp_extract
            exit 1
          fi
          
          echo "Proyecto encontrado en: $ROOT_DIR"
          # Mover todo a la raíz del workspace para simplificar rutas siguientes
          mv "$ROOT_DIR"/* . 
          rm -rf temp_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
        
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlacPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
